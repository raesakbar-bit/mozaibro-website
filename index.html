<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mozai Bro | Coming Soon</title>
  <meta name="description" content="Mozai Bro — Chess, Esports and Community. Something is coming.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0b0b0d;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      animation: fadeIn 1.5s ease;
    }

    .brand {
      font-size: clamp(42px, 9vw, 82px);
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 13px;
      letter-spacing: 5px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 65px;
    }

    .divider {
      width: 45px;
      height: 2px;
      background: #777;
      margin: 0 auto 45px;
    }

    h2 {
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 500;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .description {
      color: #888;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 55px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .socials a {
      color: #bbb;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
      transition: color 0.3s ease;
    }

    .socials a:hover {
      color: #fff;
    }

    footer {
      margin-top: 100px;
      font-size: 11px;
      color: #555;
      letter-spacing: 2px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1 class="brand">MOZAI BRO</h1>

    <p class="tagline">Chess · Esports · Community</p>

    <div class="divider"></div>

    <h2>BEYOND THE BOARD.</h2>

    <p class="description">
      Something is taking shape.<br>
      Our official website is currently under construction.<br>
      Stay connected.
    </p>

    <div class="socials">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
      <a href="https://discord.com/" target="_blank" rel="noopener noreferrer">DISCORD</a>
    </div>

    <footer>
      &copy; 2026 MOZAI BRO. ALL RIGHTS RESERVED.
    </footer>

  </main>

</body>
</html>
